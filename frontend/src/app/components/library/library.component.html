<div class="pb-32">
    <h2 class="text-3xl font-bold mb-8">Your Library</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- Create New Playlist Card -->
        <div (click)="createPlaylist()"
            class="glass-panel p-6 flex flex-col items-center justify-center min-h-[200px] cursor-pointer hover:bg-white/5 transition group border-dashed border-2 border-white/20">
            <div
                class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center mb-4 group-hover:scale-110 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </div>
            <span class="font-bold">Create Playlist</span>
        </div>

        <!-- Playlist Cards -->
        <div *ngFor="let playlist of playlists"
            class="glass-panel p-6 cursor-pointer hover:bg-white/5 transition group relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-0 group-hover:opacity-100 transition">
                <button class="bg-primary p-2 rounded-full shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </button>
            </div>

            <div
                class="w-12 h-12 rounded-lg bg-gradient-to-br from-primary to-secondary mb-4 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
            </div>

            <h3 class="font-bold text-lg mb-1">{{ playlist.name }}</h3>
            <p class="text-gray-400 text-sm">{{ playlist.songs?.length || 0 }} songs</p>
        </div>
    </div>
</div>
