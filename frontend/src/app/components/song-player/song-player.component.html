<div class="min-h-screen flex flex-col items-center justify-center p-6 pb-32 relative" *ngIf="song">
    <!-- Back Button -->
    <button (click)="back()" class="absolute top-6 left-6 p-2 hover:bg-white/10 rounded-full transition">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </button>

    <!-- CD Animation -->
    <div class="relative w-64 h-64 md:w-96 md:h-96 mb-8">
        <div class="absolute inset-0 rounded-full bg-black/20 backdrop-blur-xl border border-white/10 shadow-2xl animate-spin-slow"
            [class.paused]="!isPlaying">
            <img [src]="song.coverUrl" class="w-full h-full object-cover rounded-full p-12" alt="Cover">
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-8 h-8 bg-black rounded-full border-2 border-gray-700"></div>
            </div>
        </div>
    </div>

    <!-- Song Info -->
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold mb-2">{{ song.title }}</h1>
        <p class="text-xl text-gray-400">{{ song.artist }}</p>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-8 mb-8">
        <button (click)="toggleLike()" class="p-4 rounded-full hover:bg-white/10 transition"
            [class.text-primary]="isLiked">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                [attr.fill]="isLiked ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                </path>
            </svg>
        </button>

        <button (click)="togglePlay()"
            class="w-16 h-16 rounded-full bg-primary flex items-center justify-center shadow-lg hover:scale-105 transition">
            <svg *ngIf="!isPlaying" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg *ngIf="isPlaying" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
        </button>

        <button (click)="addToPlaylist()" class="p-4 rounded-full hover:bg-white/10 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </div>
