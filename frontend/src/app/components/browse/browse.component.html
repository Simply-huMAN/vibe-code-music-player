<div class="pb-32">
    <div class="mb-8">
        <h2 class="text-3xl font-bold mb-4">Browse</h2>
        <div class="relative">
            <input #searchBox (input)="search(searchBox.value)" type="text" placeholder="Search songs, artists..."
                class="w-full bg-white/5 border border-white/10 rounded-xl px-6 py-4 text-white focus:outline-none focus:border-primary transition text-lg">
            <div class="absolute right-6 top-1/2 transform -translate-y-1/2 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let song of songs" (click)="playSong(song)"
            class="glass-panel p-4 cursor-pointer hover:bg-white/5 transition group relative overflow-hidden">

            <div class="aspect-square rounded-lg overflow-hidden mb-4 bg-gray-800">
                <img [src]="song.coverUrl" alt="Album Art"
                    class="w-full h-full object-cover group-hover:scale-110 transition duration-500">

                <!-- Play Overlay -->
                <div
                    class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                    <div
                        class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </div>
                </div>
            </div>

            <h3 class="font-bold text-lg truncate">{{ song.title }}</h3>
            <p class="text-gray-400 text-sm">{{ song.artist }}</p>
        </div>
    </div>
</div>
