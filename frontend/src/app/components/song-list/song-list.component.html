<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-32">
    <div *ngFor="let song of songs" (click)="playSong(song)"
        class="glass-panel p-4 cursor-pointer hover:bg-white/5 transition group relative overflow-hidden">

        <div class="aspect-square rounded-lg overflow-hidden mb-4 bg-gray-800 relative">
            <img [src]="song.coverUrl" alt="Album Art"
                class="w-full h-full object-cover group-hover:scale-110 transition duration-500">

            <!-- Play Overlay -->
            <div
                class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                <div
                    class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center shadow-lg mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-start">
            <div class="overflow-hidden">
                <h3 class="font-bold text-lg truncate">{{ song.title }}</h3>
                <p class="text-gray-400 text-sm">{{ song.artist }}</p>
            </div>

            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                <button (click)="toggleLike(song, $event)" class="p-1.5 hover:bg-white/10 rounded-full transition"
                    [class.text-primary]="isLiked(song)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        [attr.fill]="isLiked(song) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                </button>
                <button (click)="addToPlaylist(song, $event)" class="p-1.5 hover:bg-white/10 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

</div>
