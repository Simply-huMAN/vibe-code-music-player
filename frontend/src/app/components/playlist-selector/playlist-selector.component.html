<div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50" (click)="close.emit()">
    <div class="glass-panel p-6 w-full max-w-md m-4" (click)="$event.stopPropagation()">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold">Add to Playlist</h3>
            <button (click)="close.emit()" class="p-2 hover:bg-white/10 rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="space-y-2 max-h-96 overflow-y-auto">
            <button *ngFor="let playlist of playlists" (click)="addToPlaylist(playlist.id)"
                class="w-full p-4 text-left hover:bg-white/10 rounded-lg transition flex items-center gap-4 group">
                <div
                    class="w-10 h-10 rounded bg-gradient-to-br from-primary to-secondary flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="18" cy="16" r="3"></circle>
                    </svg>
                </div>
                <div>
                    <div class="font-bold">{{ playlist.name }}</div>
                    <div class="text-xs text-gray-400">{{ playlist.songs?.length || 0 }} songs</div>
                </div>
                <div class="ml-auto opacity-0 group-hover:opacity-100 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </div>
            </button>

            <div *ngIf="playlists.length === 0" class="text-center py-8 text-gray-400">
                No playlists found. Create one in your Library!
            </div>
        </div>
    </div>
</div>
