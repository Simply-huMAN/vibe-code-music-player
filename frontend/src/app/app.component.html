<div class="min-h-screen text-white p-8 flex flex-col md:flex-row gap-8">
  <!-- Side Navigation -->
  <nav class="w-full md:w-64 flex-shrink-0">
    <div class="fixed md:sticky top-8 w-full md:w-64">
      <header class="mb-8">
        <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary mb-2">
          Sangeeth
        </h1>
        <p class="text-gray-400 text-sm">Premium Music</p>
      </header>

      <div class="flex flex-col gap-2">
        <a routerLink="/" routerLinkActive="bg-white/10 text-white" [routerLinkActiveOptions]="{exact: true}"
          class="flex items-center gap-4 px-6 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="font-medium">Home</span>
        </a>

        <a routerLink="/browse" routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-4 px-6 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span class="font-medium">Browse</span>
        </a>

        <a routerLink="/library" routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-4 px-6 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          <span class="font-medium">Library</span>
        </a>
      </div>

      <!-- Account Section -->
      <div class="mt-8 pt-8 border-t border-white/10 px-6">
        <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-4">Account</p>

        <div *ngIf="!isLoggedIn" class="flex flex-col gap-2">
          <a routerLink="/login"
            class="flex items-center gap-4 py-2 text-gray-400 hover:text-white transition cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span class="font-medium">Login</span>
          </a>
          <a routerLink="/register"
            class="flex items-center gap-4 py-2 text-gray-400 hover:text-white transition cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <span class="font-medium">Sign Up</span>
          </a>
        </div>

        <div *ngIf="isLoggedIn" class="flex flex-col gap-2">
          <div class="flex items-center gap-4 py-2 text-white">
            <div
              class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center font-bold">
              {{ username.charAt(0).toUpperCase() }}
            </div>
            <span class="font-medium truncate">{{ username }}</span>
          </div>
          <button (click)="logout()"
            class="flex items-center gap-4 py-2 text-gray-400 hover:text-white transition cursor-pointer w-full text-left">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="font-medium">Logout</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 min-w-0">
    <router-outlet></router-outlet>
  </main>

  <app-player-controls></app-player-controls>
</div>
